<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adoção de Animais</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #222;
    }

    header {
      border-bottom: 1px solid #ddd;
      background: #fff;
    }

    nav {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      flex-wrap: wrap;
    }

    nav button {
      border: 0;
      background: transparent;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 15px;
      border-radius: 6px;
    }

    nav button:hover,
    nav button.ativo {
      background: #f0f0f0;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      line-height: 1.6;
    }

    .acoes {
      margin-top: 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .botao {
      border: 1px solid #222;
      background: #222;
      color: white;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 6px;
    }

    .botao.secundario {
      background: white;
      color: #222;
    }

    form {
      max-width: 500px;
    }

    .campo {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f7f7f7;
    }

    .excluir {
      border: 1px solid #c33;
      color: #c33;
      background: white;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .mensagem {
      margin-top: 14px;
      padding: 10px;
      background: #f4f4f4;
      border-radius: 6px;
    }

    .vazio {
      margin-top: 20px;
      padding: 20px;
      border: 1px dashed #bbb;
      border-radius: 6px;
      color: #666;
    }

    .contador {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <button data-rota="inicio" class="ativo">Início</button>
      <button data-rota="cadastro">Cadastrar pet</button>
      <button data-rota="lista">Pets Cadastrados</button>
      <button data-rota="sobre">Sobre</button>
    </nav>
  </header>

  <main id="app"></main>

  <script>
    // Array simples para guardar os pets na memória 
    const listapets = [];

    const app = document.querySelector("#app");
    const botoesMenu = document.querySelectorAll("nav button");

    function marcarMenuAtivo(rota) {
      botoesMenu.forEach(botao => {
        botao.classList.toggle("ativo", botao.dataset.rota === rota);
      });
    }

    function irPara(rota) {
      marcarMenuAtivo(rota);

      if (rota === "inicio") mostrarInicio();
      if (rota === "cadastro") mostrarCadastro();
      if (rota === "lista") mostrarLista();
      if (rota === "sobre") mostrarSobre();
    }

    function mostrarInicio() {
      app.innerHTML = `
        <h1>Sistema de Adoção de Animais</h1>
        <p>
          Bem-vindo ao nosso site de controle de pets para  adoção.
          Aqui você pode cadastrar animais e ver a lista de bichinhos disponíveis.
        </p>

        <p>
          Os dados ficam salvos enquanto a página estiver aberta.
        </p>

        <div class="contador">
          Alunos cadastrados nesta sessão: <strong>${alunos.length}</strong>
        </div>

        <div class="acoes">
          <button class="botao" id="btnCadastrar">Cadastrar pets</button>
          <button class="botao secundario" id="btnVerAlunos">Ver Lista</button>
        </div>
      `;

      document.querySelector("#btnCadastrar")
        .addEventListener("click", () => irPara("cadastro"));

      document.querySelector("#btnVerPets")
        .addEventListener("click", () => irPara("lista"));
    }

    function mostrarCadastro() {
      app.innerHTML = `
        <h1>Cadastrar Novo pet</h1>

        <form id="formAPet">
          <div class="campo">
            <label for="nome">Nome do Pet</label>
            <input id="nome" type="text" placeholder="Ex: Mel" required />
          </div>

          <div class="campo">
            <label for="curso">Curso</label>
            <input id="curso" type="text" placeholder="Digite o curso" required />
          </div>

          <div class="campo">
            <label for="especie">Espécie (EX Cão, Gato)</label>
            <input id="especie" type="text" placeholder="Ex: Cão" required />
          </div>

          <button class="botao" type="submit">Salvar Pet</button>
          <div id="mensagem"></div>
        </form>
      `;

      document.querySelector("#formPet").addEventListener("submit", function(evento) {
        evento.preventDefault();

        const nome = document.querySelector("#nome").value.trim();
        const especie = document.querySelector("#especie").value.trim();
        const idade = document.querySelector("#idade").value.trim();

        alunos.push({
          nome,
          especie,
          idade
        });

        document.querySelector("#mensagem").innerHTML =
          `<div class="mensagem">Pet cadastrado com sucesso.</div>`;

        evento.target.reset();
      });
    }

    function mostrarLista() {
      app.innerHTML = `
        <h1>Pets Cadastrados</h1>
        <p>Lista de animais disponíveis para adoção.</p>
        <div id="conteudoLista"></div>
      `;

      renderizarTabela();
    }

    function renderizarTabela() {
      const conteudo = document.querySelector("#conteudoLista");

      if (listaPets.length === 0) {
        conteudo.innerHTML = `
          <div class="vazio">
            Nenhum pet cadastrado no momento.
          </div>
        `;
        return;
      }

      let linhas = "";

      alunos.forEach((aluno, indice) => {
        linhas += `
          <tr>
            <td>${pet.nome}</td>
            <td>${pet.especie}</td>
            <td>${pet.idade}</td>
            <td>
              <button class="excluir" data-indice="${indice}">Excluir</button>
            </td>
          </tr>
        `;
      });

      conteudo.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Espécie</th>
              <th>Idade</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody>
            ${linhas}
          </tbody>
        </table>
      `;

      document.querySelectorAll(".excluir").forEach(botao => {
        botao.addEventListener("click", function() {
          const indice = Number(this.dataset.indice);
          alunos.splice(indice, 1);
          renderizarTabela();
        });
      });
    }

    function mostrarSobre() {
      app.innerHTML = `
        <h1>Sobre o projeto</h1>
        <p>
          Este exemplo foi criado para demonstrar uma Single Page Application simples.
        </p>
        <p>
          Existe apenas um arquivo HTML. Ao clicar nas opções do menu,
          o JavaScript modifica o conteúdo do elemento <strong>#app</strong>.
        </p>
        <p>
          O projeto também demonstra cadastro em array, manipulação do DOM,
          eventos de clique, envio de formulário, listagem e exclusão.
        </p>
      `;
    }

    botoesMenu.forEach(botao => {
      botao.addEventListener("click", () => {
        irPara(botao.dataset.rota);
      });
    });

    mostrarInicio();
  </script>
</body>
</html>
